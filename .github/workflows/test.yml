name: test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Run test
        run: bundle exec rubocop lib
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ruby: ['4.0.10', '3.3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run test
        env:
          COVERAGE: true
        run: bundle exec rspec
      - name: Build gem
        run: bundle exec rake build
      - name: Upload coverage to Codecov
        if: matrix.ruby == '4.0.10' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: efe02ed0-e754-42a6-bb90-bbf345747bdc
          files: coverage/.resultset.json
