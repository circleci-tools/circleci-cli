name: test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - name: Install dependencies
        env:
          BUNDLE_FROZEN: "true"
        run: bundle install --jobs 4
      - name: Run test
        run: bundle exec rubocop lib
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ruby: ['3.4.13', '3.3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install dependencies
        env:
          BUNDLE_FROZEN: "true"
        run: bundle install --jobs 4
      - name: Run test
        env:
          COVERAGE: true
        run: bundle exec rspec
      - name: Report coverage
        run: |
          ruby -rjson -e '
            lines = JSON.parse(File.read("coverage/coverage.json")).fetch("total").fetch("lines")
            printf "Line coverage: %.2f%% (%d/%d lines)\n", lines.fetch("percent"), lines.fetch("covered"), lines.fetch("total")
          ' >> "$GITHUB_STEP_SUMMARY"
