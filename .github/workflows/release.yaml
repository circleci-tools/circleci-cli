name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
      - name: Setup Git
        run: |
          git config --global user.email "unhappychoice@gmail.com"
          git config --global user.name "Yuji Ueki"
      - name: Bump version
        run: |
          BUNDLE_FROZEN=true bundle exec gem bump --version ${{inputs.version}} --message ':tada: Bump %{name} to %{version}'
          bundle config set frozen false && bundle install
          git add . && git commit --amend --no-edit
      - name: Determine release tag
        id: version
        run: echo "tag=v$(ruby -Ilib -e "require 'circleci/cli/version'; puts CircleCI::CLI::VERSION")" >> "$GITHUB_OUTPUT"
      - uses: rubygems/release-gem@2654a0fe0dc39725c07fe84d7fe863a084f2424e # v1.5.0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --verify-tag --generate-notes
